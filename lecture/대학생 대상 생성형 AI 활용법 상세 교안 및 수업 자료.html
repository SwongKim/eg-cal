<script>const DATA={"pages":[{"id":"area-1","group":"basic","number":"01","title":"수업 이해와 시험 대비","fullTitle":"강의 영역 1 : 수업 이해와 시험 대비","summary":"A. 선행 교육 : Obsidian과 Obsidian Web Clipper 기초","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-01-수업이해와시험대비.png\" alt=\"수업 이해와 시험 대비 전체 흐름\">\u003cfigcaption>수업 이해와 시험 대비 전체 흐름\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p0-1\">먼저 익힐 내용 : Obsidian과 Obsidian Web Clipper 기초\u003c/h3>\u003cp>첫 강의 영역의 본 실습에 앞서 모든 결과물을 축적할 공통 작업 환경을 구성한다. 도구의 고급 기능보다 \u003ccode>어디에 저장하고, 어떻게 다시 찾고, 무엇과 연결할 것인가\u003c/code>를 이해하는 데 초점을 둔다.\u003c/p>\n\u003ch4 id=\"p0-2\">a. 학습목표\u003c/h4>\u003cp>수강생은 다음을 수행할 수 있다.\u003c/p>\n\u003col>\n\u003cli>Obsidian 보관함을 만들고 권장 폴더 구조를 구성한다.\u003c/li>\n\u003cli>Markdown의 제목, 목록, 표, 링크, 이미지와 콜아웃 문법을 사용한다.\u003c/li>\n\u003cli>프론트매터에 과목, 날짜, 출처, 상태와 태그를 기록한다.\u003c/li>\n\u003cli>\u003ccode>[[내부 링크]]\u003c/code>를 이용해 수업 노트와 개념 노트를 연결한다.\u003c/li>\n\u003cli>Obsidian Web Clipper로 웹 자료를 저장하고 원문 URL과 수집일을 남긴다.\u003c/li>\n\u003cli>수집한 자료와 자신의 해석을 구분한다.\u003c/li>\n\u003c/ol>\n\u003ch4 id=\"p0-3\">화면을 보며 따라 하기\u003c/h4>\u003col>\n\u003cli>\u003ccode>캠퍼스-AI-워크플로\u003c/code> 보관함을 생성한다.\u003c/li>\n\u003cli>\u003ccode>01-수업\u003c/code>, \u003ccode>02-자료조사\u003c/code>, \u003ccode>90-템플릿\u003c/code>, \u003ccode>99-첨부파일\u003c/code> 폴더를 만든다.\u003c/li>\n\u003cli>\u003ccode>90-템플릿/수업 노트 템플릿.md\u003c/code>를 생성하고 공통 프론트매터를 입력한다.\u003c/li>\n\u003cli>예시 웹페이지를 Obsidian Web Clipper로 저장한다.\u003c/li>\n\u003cli>저장된 노트에서 제목, 본문, 이미지, 원문 URL과 수집일을 확인한다.\u003c/li>\n\u003cli>수집 노트에 \u003ccode>## 나의 해석\u003c/code>을 추가하고 관련 수업 노트와 연결한다.\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong class=\"callout-title\">Web Clipper 사용 원칙\u003c/strong>\n로그인이 필요한 강의자료, 유료 문서, 개인정보가 포함된 페이지와 재배포가 금지된 자료는 무단으로 수집하지 않는다. Web Clipper 노트는 원문의 소유권을 이전하는 도구가 아니라 개인 학습을 위한 출처 기록 도구다.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"p0-5\">B. 본 교육 학습목표\u003c/h3>\u003cp>수강생은 강의계획서, 과제 지시문, 수업자료와 개인 필기를 하나의 과목 지식 기반으로 구성하고, 이를 바탕으로 검증 가능한 복습 자료와 연습문제를 만들 수 있다.\u003c/p>\n\u003ch3 id=\"p0-6\">준비하기\u003c/h3>\u003cul>\n\u003cli>공개용 샘플 강의계획서\u003c/li>\n\u003cli>2~3주 분량의 강의 슬라이드 또는 교재 발췌본\u003c/li>\n\u003cli>개인 필기 예시\u003c/li>\n\u003cli>샘플 과제 지시문과 평가 기준\u003c/li>\n\u003cli>개인정보가 제거된 샘플 공지사항\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-02-시험대비학습워크플로.png\" alt=\"시험 대비 학습 워크플로\">\u003cfigcaption>시험 대비 학습 워크플로\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p0-7\">따라 해보기\u003c/h3>\u003ch4 id=\"p0-8\">a. 강의계획서와 과제 지시문 해체\u003c/h4>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>학습목표, 평가 방식, 시험 범위, 제출 형식과 마감을 표시한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 학습목표, 평가 방식, 시험 범위, 제출 형식과 마감을 표시한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI에게 \u003ccode>명시된 요구사항\u003c/code>, \u003ccode>추론한 내용\u003c/code>, \u003ccode>확인이 필요한 내용\u003c/code>으로 분리하게 한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI에게 명시된 요구사항 , 추론한 내용 , 확인이 필요한 내용 으로 분리하게 한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-03-요구사항분리.png\" alt=\"과제 요구사항을 명시됨·추론·확인 필요로 분리하는 방법\">\u003cfigcaption>과제 요구사항을 명시됨·추론·확인 필요로 분리하는 방법\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>원문과 추출 결과를 대조하고 누락된 조건을 수정한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 원문과 추출 결과를 대조하고 누락된 조건을 수정한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>확인이 필요한 항목을 교수자 또는 조교에게 질문할 문장으로 바꾼다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 확인이 필요한 항목을 교수자 또는 조교에게 질문할 문장으로 바꾼다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003ch4 id=\"p0-9\">b. 과목별 통합 노트 제작\u003c/h4>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>수업자료, 교재와 개인 필기에서 동일 개념을 모은다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI의 답보다 원자료가 판단의 기준이다. 출처와 작성 시점까지 함께 확보해야 나중에 다시 검증할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 수업자료, 교재와 개인 필기에서 동일 개념을 모은다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 원문 위치, 작성자 또는 기관, 날짜가 노트에 남았는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-04-통합학습노트.png\" alt=\"수업자료·교재·개인 필기를 통합 학습 노트로 만드는 방법\">\u003cfigcaption>수업자료·교재·개인 필기를 통합 학습 노트로 만드는 방법\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>각 개념을 정의, 원리, 예시, 반례, 관련 개념으로 구조화한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 각 개념을 정의, 원리, 예시, 반례, 관련 개념으로 구조화한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>원문 인용과 자기 설명을 구분한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 원문 인용과 자기 설명을 구분한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>관련 개념을 \u003ccode>[[내부 링크]]\u003c/code>로 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 관련 개념을 [[내부 링크]] 로 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-05-내부링크연결.png\" alt=\"관련 개념을 내부 링크로 연결하는 방법\">\u003cfigcaption>관련 개념을 내부 링크로 연결하는 방법\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003ch4 id=\"p0-10\">c. 시험 대비 자료 제작\u003c/h4>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">09\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>학습목표별 핵심 개념을 표로 만든다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 학습목표별 핵심 개념을 표로 만든다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">10\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>객관식, 단답형, 서술형과 계산형 연습문제를 생성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 객관식, 단답형, 서술형과 계산형 연습문제를 생성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">11\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>각 문항에 근거 노트, 정답, 채점 기준과 오답 이유를 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 각 문항에 근거 노트, 정답, 채점 기준과 오답 이유를 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">12\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>학생이 먼저 답한 뒤 AI에게 취약 개념과 후속 문제를 요청한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 학생이 먼저 답한 뒤 AI에게 취약 개념과 후속 문제를 요청한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역1-06-시험대비노트완성.png\" alt=\"수업 자료에서 시험 대비 노트까지의 실습 흐름\">\u003cfigcaption>수업 자료에서 시험 대비 노트까지의 실습 흐름\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p0-11\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-text\">다음 강의계획서와 과제 지시문을 분석해줘.\n1. 원문에 명시된 학습목표, 제출물, 형식, 마감과 평가 기준\n2. 원문만으로 확정할 수 없는 사항\n3. 교수자에게 확인할 질문\n4. 제출 전 체크리스트\n추론한 내용은 사실처럼 쓰지 말고 반드시 '확인 필요'로 표시해줘.\n결과는 Obsidian에 저장할 Markdown으로 작성해줘.\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003ch3 id=\"p0-12\">완성할 결과물과 저장 위치\u003c/h3>\u003cul>\n\u003cli>\u003ccode>01-수업/과목명/강의계획서 분석.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>01-수업/과목명/통합 학습 노트.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>01-수업/과목명/시험 대비 문제 세트.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>01-수업/과목명/오답과 취약 개념.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>01-수업/과목명/복습 계획.md\u003c/code>\u003c/li>\n\u003c/ul>\n"},{"id":"area-2","group":"basic","number":"02","title":"교재와 학습 자료 접근","fullTitle":"강의 영역 2 : 교재와 학습 자료 접근","summary":"수강생은 교재, 논문, 표준과 공개 강의자료의 정확한 서지정보를 확인하고, 대학 도서관·공식 데이터베이스·오픈 액세스를 이용한 합법적 접근 경로를 기록할 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역2-01-교재와학습자료접근.png\" alt=\"교재와 학습 자료 접근\">\u003cfigcaption>교재와 학습 자료 접근\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p1-1\">학습목표\u003c/h3>\u003cp>수강생은 교재, 논문, 표준과 공개 강의자료의 정확한 서지정보를 확인하고, 대학 도서관·공식 데이터베이스·오픈 액세스를 이용한 합법적 접근 경로를 기록할 수 있다.\u003c/p>\n\u003ch3 id=\"p1-2\">준비하기\u003c/h3>\u003cul>\n\u003cli>제목과 판본이 유사한 교재 사례\u003c/li>\n\u003cli>DOI가 있는 논문과 철회된 논문 사례\u003c/li>\n\u003cli>대학 도서관 통합검색 화면\u003c/li>\n\u003cli>기관 리포지터리와 오픈 액세스 논문 예시\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역2-02-학습자료접근6단계.png\" alt=\"학습 자료 접근 6단계\">\u003cfigcaption>학습 자료 접근 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p1-3\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>과제에 필요한 자료의 종류, 연도, 언어, 난이도와 사용 목적을 정의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 과제에 필요한 자료의 종류, 연도, 언어, 난이도와 사용 목적을 정의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>교재는 제목, 저자, ISBN, 판과 출판사를 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 교재는 제목, 저자, ISBN, 판과 출판사를 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역2-03-교재서지정보확인.png\" alt=\"교재 서지정보 확인\">\u003cfigcaption>교재 서지정보 확인\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>논문은 제목, 저자, 저널, 연도와 DOI를 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 논문은 제목, 저자, 저널, 연도와 DOI를 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>도서관 소장·구독 여부, 원문복사, 저자 공개본과 기관 리포지터리를 순서대로 탐색한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 도서관 소장·구독 여부, 원문복사, 저자 공개본과 기관 리포지터리를 순서대로 탐색한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI가 추천한 자료는 공식 검색 서비스에서 실제 존재 여부를 검증한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI가 추천한 자료는 공식 검색 서비스에서 실제 존재 여부를 검증한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역2-04-추천자료실재여부검증.png\" alt=\"추천 자료 실재 여부 검증\">\u003cfigcaption>추천 자료 실재 여부 검증\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>찾은 자료의 접근 경로, 이용 조건과 수업 적합성을 비교한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 찾은 자료의 접근 경로, 이용 조건과 수업 적합성을 비교한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>Web Clipper로 서지 페이지를 저장하고 원문 파일과 구분한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> Web Clipper로 서지 페이지를 저장하고 원문 파일과 구분한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역2-05-자료탐색에서지식기록까지.png\" alt=\"자료 탐색에서 지식 기록까지\">\u003cfigcaption>자료 탐색에서 지식 기록까지\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p1-4\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cp>존재하지 않는 참고문헌이 포함된 AI 답변을 제시한 뒤 DOI, 저널 홈페이지와 도서관 검색을 통해 오류를 발견하는 과정을 보여준다. 이어 동일 주제의 합법적 공개 자료를 찾아 \u003ccode>자료 접근 경로표.md\u003c/code>에 기록한다.\u003c/p>\n\u003c/div>\u003ch3 id=\"p1-5\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 자료 접근 경로표\n\n| 자료 | 정확한 식별정보 | 접근 경로 | 이용 조건 | 수업 적합성 | 검증 상태 |\n|---|---|---|---|---|---|\n\n## 판본 비교\n\n## AI 추천 자료 검증 기록\n\n## 합법적 대체 자료\u003c/code>\u003c/pre>\u003c/div>\u003ch3 id=\"p1-6\">완성할 결과물과 저장 위치\u003c/h3>\u003cul>\n\u003cli>\u003ccode>02-자료조사/자료 접근 경로표.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>02-자료조사/교재 판본 비교.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>02-자료조사/참고문헌 라이브러리.md\u003c/code>\u003c/li>\n\u003cli>\u003ccode>02-자료조사/AI 추천 자료 검증 기록.md\u003c/code>\u003c/li>\n\u003c/ul>\n"},{"id":"area-3","group":"basic","number":"03","title":"발표자료, 이미지와 영상 제작","fullTitle":"강의 영역 3 : 발표자료, 이미지와 영상 제작","summary":"수강생은 발표 목적과 청중에 맞는 스토리라인을 설계하고, AI로 슬라이드·이미지·영상 초안을 제작한 뒤 출처, 글자, 사실성과 시각적 일관성을 검수할 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-01-발표자료이미지영상제작.png\" alt=\"발표자료·이미지·영상 제작\">\u003cfigcaption>발표자료·이미지·영상 제작\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p2-1\">학습목표\u003c/h3>\u003cp>수강생은 발표 목적과 청중에 맞는 스토리라인을 설계하고, AI로 슬라이드·이미지·영상 초안을 제작한 뒤 출처, 글자, 사실성과 시각적 일관성을 검수할 수 있다.\u003c/p>\n\u003ch3 id=\"p2-2\">준비하기\u003c/h3>\u003cul>\n\u003cli>3분 발표용 원문 자료\u003c/li>\n\u003cli>발표 평가 기준표\u003c/li>\n\u003cli>저작권과 초상권 검토 사례\u003c/li>\n\u003cli>이미지 생성 및 영상 생성 도구의 샘플 결과\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-02-콘텐츠제작6단계.png\" alt=\"콘텐츠 제작 6단계\">\u003cfigcaption>콘텐츠 제작 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p2-3\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>발표의 목적, 청중, 시간과 한 문장 핵심 메시지를 정한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 발표의 목적, 청중, 시간과 한 문장 핵심 메시지를 정한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>\u003ccode>문제 → 근거 → 해석 → 제안 → 행동 요청\u003c/code>으로 스토리라인을 구성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 문제 → 근거 → 해석 → 제안 → 행동 요청 으로 스토리라인을 구성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-03-스토리라인만들기.png\" alt=\"스토리라인 만들기\">\u003cfigcaption>스토리라인 만들기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>슬라이드별 제목, 핵심 문장, 근거와 발표자 노트를 Markdown으로 먼저 작성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 슬라이드별 제목, 핵심 문장, 근거와 발표자 노트를 Markdown으로 먼저 작성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>이미지가 설명에 실제로 기여하는 슬라이드만 선별한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 이미지가 설명에 실제로 기여하는 슬라이드만 선별한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>이미지 프롬프트에 주제, 구도, 색상, 화면비와 제외 요소를 명시한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 이미지 프롬프트에 주제, 구도, 색상, 화면비와 제외 요소를 명시한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-04-좋은이미지프롬프트.png\" alt=\"좋은 이미지 프롬프트\">\u003cfigcaption>좋은 이미지 프롬프트\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>짧은 영상은 기준 이미지, 시작·종료 상태, 움직임, 길이와 자막 여부를 먼저 설계한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI의 답보다 원자료가 판단의 기준이다. 출처와 작성 시점까지 함께 확보해야 나중에 다시 검증할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 짧은 영상은 기준 이미지, 시작·종료 상태, 움직임, 길이와 자막 여부를 먼저 설계한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 원문 위치, 작성자 또는 기관, 날짜가 노트에 남았는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI가 만든 이미지의 글자, 손·도형·수치와 사실관계를 검수한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI가 만든 이미지의 글자, 손·도형·수치와 사실관계를 검수한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>최종 슬라이드와 영상을 파생 파일로 내보내고 원본 Markdown에 경로를 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 최종 슬라이드와 영상을 파생 파일로 내보내고 원본 Markdown에 경로를 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-05-파생파일내보내기.png\" alt=\"파생 파일 내보내기\">\u003cfigcaption>파생 파일 내보내기\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-06-아이디어에서발표까지.png\" alt=\"아이디어에서 발표까지\">\u003cfigcaption>아이디어에서 발표까지\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p2-4\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cp>하나의 설명 문단을 다음 결과로 변환한다.\u003c/p>\n\u003col>\n\u003cli>5장짜리 슬라이드 구성안\u003c/li>\n\u003cli>핵심 개념 인포그래픽\u003c/li>\n\u003cli>6초 분량의 도입 영상 기획안\u003c/li>\n\u003cli>1분 발표자 노트\u003c/li>\n\u003c/ol>\n\u003c/div>\u003ch3 id=\"p2-5\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 발표 프로젝트\n\n## 발표 목적과 청중\n\n## 한 문장 핵심 메시지\n\n## 슬라이드 구성\n\n| 번호 | 슬라이드 제목 | 핵심 근거 | 시각자료 | 발표자 노트 |\n|---|---|---|---|---|\n\n## 이미지 프롬프트\n\n## 영상 구성\n\n| 시간 | 화면 | 움직임 | 내레이션·자막 |\n|---|---|---|---|\n\n## 출처와 권리 검토\n\n## 최종 파일 경로\u003c/code>\u003c/pre>\u003c/div>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역3-07-콘텐츠프로젝트지식관리.png\" alt=\"콘텐츠 프로젝트 지식관리\">\u003cfigcaption>콘텐츠 프로젝트 지식관리\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p2-6\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>발표 스토리라인과 발표자 노트\u003c/li>\n\u003cli>5장 내외의 짧은 발표자료\u003c/li>\n\u003cli>설명용 이미지 또는 인포그래픽 1장\u003c/li>\n\u003cli>6~10초 분량의 짧은 영상 또는 상세 스토리보드\u003c/li>\n\u003cli>시각자료 출처와 생성 이력표\u003c/li>\n\u003c/ul>\n"},{"id":"area-4","group":"basic","number":"04","title":"유튜브 영상 기반 과제와 학습","fullTitle":"강의 영역 4 : 유튜브 영상 기반 과제와 학습","summary":"수강생은 교수자가 제시한 공개 영상의 자막과 메타데이터를 수집하고, 핵심 내용·타임스탬프·복습 질문을 포함한 검증 가능한 학습 노트를 만들 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-01-유튜브영상기반과제와학습.png\" alt=\"유튜브 영상 기반 과제와 학습\">\u003cfigcaption>유튜브 영상 기반 과제와 학습\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p3-1\">학습목표\u003c/h3>\u003cp>수강생은 교수자가 제시한 공개 영상의 자막과 메타데이터를 수집하고, 핵심 내용·타임스탬프·복습 질문을 포함한 검증 가능한 학습 노트를 만들 수 있다.\u003c/p>\n\u003ch3 id=\"p3-2\">준비하기\u003c/h3>\u003cul>\n\u003cli>자막이 제공되는 공개 교육 영상\u003c/li>\n\u003cli>영상 기반 과제 지시문\u003c/li>\n\u003cli>자막이 부정확한 구간과 고유명사가 포함된 사례\u003c/li>\n\u003cli>영상 요약용 프롬프트 또는 Claude Skill\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-02-영상학습6단계.png\" alt=\"영상 학습 6단계\">\u003cfigcaption>영상 학습 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"area4-real-case\">실제 수행 사례 : YouTube 요약 Skill 만들기\u003c/h3>\n\u003cp>이 실습에서는 영상을 한 번 요약하는 데서 끝내지 않고, YouTube URL을 입력하면 자막을 수집·요약하고 타임스탬프와 메타데이터가 포함된 Markdown 파일로 저장하는 반복 가능한 작업 흐름을 만든다. 실제 화면은 Claude의 Cowork와 Skill을 사용하지만, 핵심 원리는 다른 AI 도구에도 적용할 수 있다.\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong class=\"callout-title\">이번 사례의 완성 기준\u003c/strong> URL 하나를 입력해 요약 파일을 만들고, 파일 위치·프론트매터·타임스탬프·고유명사·숫자를 원본 영상과 대조한 뒤 Obsidian 지식 노트로 연결할 수 있어야 한다.\u003c/p>\u003c/blockquote>\n\u003ch4 id=\"area4-case-1\">1. 저장 위치와 작업 범위를 먼저 정한다\u003c/h4>\n\u003cp>자동화는 출력 위치가 불명확하면 성공 여부를 판단하기 어렵다. 먼저 프로젝트 안에 \u003ccode>유튜브_영상_요약\u003c/code> 폴더를 만들고, AI에는 전체 다운로드 폴더가 아니라 필요한 프로젝트 폴더만 연결한다. 폴더명은 Skill 지침과 파일 경로에 그대로 쓰이므로 오탈자가 없는지 확인한다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-08-요약폴더생성.png\" alt=\"YouTube 영상 요약 파일을 저장할 폴더 생성\">\u003cfigcaption>YouTube 영상 요약 파일을 저장할 폴더 생성\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-09-프로젝트폴더선택.png\" alt=\"Cowork에서 필요한 프로젝트 폴더만 선택\">\u003cfigcaption>Cowork에서 필요한 프로젝트 폴더만 선택\u003c/figcaption>\u003c/figure>\n\u003ch4 id=\"area4-case-2\">2. 입력·처리·출력을 포함해 Skill을 요청한다\u003c/h4>\n\u003cp>\u003ccode>/skill-creator\u003c/code>에는 단순히 “영상을 요약해 줘”라고 쓰지 않는다. 입력은 YouTube URL, 처리는 자막 요약과 구조화, 출력은 지정 폴더의 Markdown 파일이라는 점을 분명히 한다. 파일명 규칙과 프론트매터, 타임스탬프도 처음부터 요구해야 반복 실행할 때 결과 형식이 흔들리지 않는다.\u003c/p>\n\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-text\">/skill-creator 유튜브 영상 요약 스킬을 만들어줘.\n입력 : 사용자가 제공하는 YouTube URL\n처리 : 영상 자막을 타임스탬프별로 요약하고 핵심 주장과 근거를 구조화\n출력 : 유튜브_영상_요약 폴더에 요약_{{제목}}.md로 저장\n포함 : 원본 URL, 영상 제목, 채널, 게시일, 길이, 자막 언어, 핵심 요약, 검증 항목\n주의 : 자막에 없는 내용은 추측하지 말고 확인 필요로 표시\u003c/code>\u003c/pre>\u003c/div>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-10-스킬생성요청.png\" alt=\"입력·처리·출력 규칙을 포함한 Skill 생성 요청\">\u003cfigcaption>입력·처리·출력 규칙을 포함한 Skill 생성 요청\u003c/figcaption>\u003c/figure>\n\u003ch4 id=\"area4-case-3\">3. 저장 전에 Skill의 동작 규칙을 검토한다\u003c/h4>\n\u003cp>생성된 Skill 카드에서 이름과 설명만 보지 말고 트리거, 저장 경로, 파일명, 출력 구조와 접근 범위를 확인한다. 저장이 되지 않으면 같은 요청을 반복하기보다 설치 가능한 구조로 패키징해 달라고 요청하고, 필수 파일과 확장명이 갖춰졌는지 다시 점검한다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-11-스킬저장.png\" alt=\"생성된 Skill의 규칙을 확인한 뒤 저장\">\u003cfigcaption>생성된 Skill의 규칙을 확인한 뒤 저장\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-12-패키징재시도.png\" alt=\"저장 오류가 발생했을 때 설치 가능한 형태로 패키징 재요청\">\u003cfigcaption>저장 오류가 발생했을 때 설치 가능한 형태로 패키징 재요청\u003c/figcaption>\u003c/figure>\n\u003ch4 id=\"area4-case-4\">4. 실제 URL로 실행하고 성공 조건을 확인한다\u003c/h4>\n\u003cp>Cowork에서 \u003ccode>/yt-summarizer\u003c/code>와 YouTube URL을 함께 입력한다. 실행 전에는 작업 폴더가 맞는지 확인한다. 완료 메시지만으로 성공을 판단하지 말고 자막을 실제로 가져왔는지, 영상 메타데이터와 저장 경로가 보고됐는지 살핀다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-13-스킬실행.png\" alt=\"YouTube URL을 입력해 요약 Skill 실행\">\u003cfigcaption>YouTube URL을 입력해 요약 Skill 실행\u003c/figcaption>\u003c/figure>\n\u003ch4 id=\"area4-case-5\">5. 자막 접근에 실패하면 원인과 대안을 분리한다\u003c/h4>\n\u003cp>AI가 YouTube에 직접 접근하지 못할 수 있다. 이때 무작정 재시도하지 말고 “실패 원인, 내가 해야 할 조치, 가능한 대안”을 나누어 설명하게 한다. 한 번만 처리한다면 YouTube의 \u003ccode>스크립트 표시\u003c/code>에서 자막을 복사하는 방법이 빠르다. 반복 자동화가 목적이라면 공식 브라우저 연동을 검토한다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-14-실패원인진단.png\" alt=\"실패 원인과 사용자가 해야 할 조치를 구분해 요청\">\u003cfigcaption>실패 원인과 사용자가 해야 할 조치를 구분해 요청\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-15-해결책선택.png\" alt=\"자막 직접 복사와 브라우저 연동 방식 비교\">\u003cfigcaption>자막 직접 복사와 브라우저 연동 방식 비교\u003c/figcaption>\u003c/figure>\n\u003cblockquote>\u003cp>\u003cstrong class=\"callout-title\">브라우저 연동 주의\u003c/strong> 확장 프로그램은 공식 제공자와 도메인을 확인하고, 요청 권한을 읽은 뒤 설치한다. 회사·기관 계정은 관리 정책을 먼저 확인한다. 필요하지 않을 때는 확장을 끄거나 제거한다.\u003c/p>\u003c/blockquote>\n\u003ch4 id=\"area4-case-6\">6. 활성 탭·자막·확장 충돌을 점검한다\u003c/h4>\n\u003cp>연동 후에도 자막이 비어 있으면 대상 YouTube 탭을 화면 앞으로 가져오고 영상과 자막 패널이 실제로 로드되는지 확인한다. 광고 차단 확장이 동작을 막는 경우에는 YouTube 사이트에 한해 일시 중지한 뒤 다시 시도한다. 변경한 조건을 오류 기록에 남기면 다음 실행에서 같은 시행착오를 줄일 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-16-활성탭재시도.png\" alt=\"대상 YouTube 탭을 활성화한 뒤 재시도\">\u003cfigcaption>대상 YouTube 탭을 활성화한 뒤 재시도\u003c/figcaption>\u003c/figure>\n\u003ch4 id=\"area4-case-7\">7. 완료 메시지가 아니라 생성 파일을 검수한다\u003c/h4>\n\u003cp>작업이 끝나면 완료 메시지에서 파일명, 저장 위치, 영상 길이, 자막 언어와 세그먼트 수를 확인한다. 이어 파일 탐색기에서 \u003ccode>요약_{{제목}}.md\u003c/code>가 실제로 생성됐는지 확인하고 Obsidian에서 연다.\u003c/p>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-17-스킬수행완료.png\" alt=\"Skill 수행 완료 메시지와 저장 정보 확인\">\u003cfigcaption>Skill 수행 완료 메시지와 저장 정보 확인\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-18-md파일확인.png\" alt=\"지정 폴더에 생성된 Markdown 파일 확인\">\u003cfigcaption>지정 폴더에 생성된 Markdown 파일 확인\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"lesson-screenshot\">\u003cimg src=\"images_demo/강의영역4-19-옵시디언검수.png\" alt=\"Obsidian에서 프론트매터·타임스탬프·요약 내용 검수\">\u003cfigcaption>Obsidian에서 프론트매터·타임스탬프·요약 내용 검수\u003c/figcaption>\u003c/figure>\n\u003cp>마지막으로 영상 제목, 채널, 게시일, 길이, 자막 언어, 타임스탬프, 고유명사, 숫자와 인용 문장을 원본 영상과 대조한다. 자동 요약은 학습의 시작점이며, 원문 검증과 자신의 해석을 추가해야 지식 노트가 된다.\u003c/p>\n\u003ch3 id=\"area4-troubleshooting\">문제가 생겼을 때 확인할 순서\u003c/h3>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>증상\u003c/th>\u003cth>먼저 확인할 것\u003c/th>\u003cth>대안\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>자막을 가져오지 못함\u003c/td>\u003ctd>영상에 자막이 있는지, 대상 탭이 활성화됐는지 확인\u003c/td>\u003ctd>\u003ccode>스크립트 표시\u003c/code>에서 자막을 직접 복사\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>브라우저 연동이 동작하지 않음\u003c/td>\u003ctd>공식 확장, 같은 계정, 승인 권한, 브라우저 재시작 확인\u003c/td>\u003ctd>필요한 사이트에서만 확장을 켜고 재시도\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>요약 파일이 보이지 않음\u003c/td>\u003ctd>Skill이 보고한 경로와 연결한 프로젝트 폴더 비교\u003c/td>\u003ctd>파일 탐색기 새로 고침과 파일명 규칙 확인\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>타임스탬프나 고유명사가 틀림\u003c/td>\u003ctd>해당 구간의 원본 영상과 자막 대조\u003c/td>\u003ctd>수정 이유를 검증 기록에 남기고 요약 갱신\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"area4-practice\">직접 해보기\u003c/h3>\n\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">실습 과제\u003c/div>\u003cp>10분 이내의 공개 YouTube 영상 하나를 선택한다. 자막 직접 복사 방식 또는 허용된 브라우저 연동 방식으로 요약 파일을 만들고, 원본 대조 결과를 기록한다.\u003c/p>\u003cul>\u003cli>결과물 : \u003ccode>02-자료조사/영상요약/요약_제목.md\u003c/code>\u003c/li>\u003cli>필수 항목 : 원본 URL, 메타데이터, 타임스탬프별 요약, 핵심 주장과 근거, 복습 질문, 검증 기록\u003c/li>\u003cli>완료 기준 : 틀린 고유명사·숫자·타임스탬프를 최소 한 번 찾아 수정하고 그 이유를 남김\u003c/li>\u003c/ul>\u003c/div>\u003ch3 id=\"p3-3\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>과제의 학습목표와 영상에서 확인해야 할 질문을 먼저 적는다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 과제의 학습목표와 영상에서 확인해야 할 질문을 먼저 적는다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>영상 제목, 채널, 게시일, 길이, URL과 자막 언어를 기록한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 영상 제목, 채널, 게시일, 길이, URL과 자막 언어를 기록한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-03-영상기본정보기록.png\" alt=\"영상 기본정보 기록\">\u003cfigcaption>영상 기본정보 기록\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>자막을 수집하되 자동 자막의 오인식 가능성을 표시한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 자막을 수집하되 자동 자막의 오인식 가능성을 표시한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>내용을 주제별로 나누고 각 항목에 타임스탬프를 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 내용을 주제별로 나누고 각 항목에 타임스탬프를 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI에게 핵심 요약, 용어 설명, 주장과 근거, 복습 질문을 생성하게 한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI에게 핵심 요약, 용어 설명, 주장과 근거, 복습 질문을 생성하게 한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-04-AI영상학습자료만들기.png\" alt=\"AI로 영상 학습자료 만들기\">\u003cfigcaption>AI로 영상 학습자료 만들기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>고유명사, 숫자, 인용과 결론을 원본 영상과 대조한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 고유명사, 숫자, 인용과 결론을 원본 영상과 대조한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>자신의 해석과 교수자가 요구한 답변을 별도 항목으로 작성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 자신의 해석과 교수자가 요구한 답변을 별도 항목으로 작성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>영상 노트를 관련 과목 및 개념 노트와 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 영상 노트를 관련 과목 및 개념 노트와 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-05-영상노트연결하기.png\" alt=\"영상 노트 연결하기\">\u003cfigcaption>영상 노트 연결하기\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-06-영상에서학습노트까지.png\" alt=\"영상에서 학습 노트까지\">\u003cfigcaption>영상에서 학습 노트까지\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p3-4\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cp>직접 제작한 유튜브 영상 요약 Claude Skill을 이용해 URL 입력부터 Markdown 저장까지 보여준다. 이후 결과 중 하나의 숫자 또는 고유명사를 원본 타임스탬프와 대조해 \u003ccode>AI 출력은 검증 전에는 학습 근거가 아니다\u003c/code>라는 원칙을 시연한다.\u003c/p>\n\u003c/div>\u003ch3 id=\"p3-5\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\">---\ntitle: &quot;영상 제목&quot;\nchannel: &quot;채널명&quot;\npublished: YYYY-MM-DD\nduration: &quot;00:00&quot;\nurl: &quot;https://...&quot;\ntranscript_language: ko\nverification: 검토중\n---\n\n# 영상 학습 노트\n\n## 시청 목적\n\n## 타임스탬프별 핵심 내용\n\n## 핵심 용어\n\n## 주장과 근거\n\n## 복습 질문\n\n## 원본 대조 기록\n\n## 나의 해석과 과제 적용\u003c/code>\u003c/pre>\u003c/div>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역4-07-영상학습지식관리.png\" alt=\"영상 학습 지식관리\">\u003cfigcaption>영상 학습 지식관리\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p3-6\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>타임스탬프가 포함된 영상 학습 노트\u003c/li>\n\u003cli>핵심 개념표와 용어집\u003c/li>\n\u003cli>복습 질문 및 예상 문제\u003c/li>\n\u003cli>자동 자막과 AI 요약의 오류 수정 기록\u003c/li>\n\u003c/ul>\n"},{"id":"area-5","group":"campus","number":"05","title":"팀 프로젝트, 동아리와 학생자치 활동","fullTitle":"강의 영역 5 : 팀 프로젝트, 동아리와 학생자치 활동","summary":"수강생은 팀의 목표, 역할, 일정, 의사결정과 변경 이력을 투명하게 기록하고, 동아리·학생회 활동에 필요한 홍보 및 운영 문서를 재사용 가능한 Markdown 템플릿으로 만들 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역5-01-팀프로젝트동아리학생자치.png\" alt=\"팀 프로젝트, 동아리와 학생자치 활동\">\u003cfigcaption>팀 프로젝트, 동아리와 학생자치 활동\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p4-1\">학습목표\u003c/h3>\u003cp>수강생은 팀의 목표, 역할, 일정, 의사결정과 변경 이력을 투명하게 기록하고, 동아리·학생회 활동에 필요한 홍보 및 운영 문서를 재사용 가능한 Markdown 템플릿으로 만들 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역5-02-팀활동6단계.png\" alt=\"팀 활동 6단계\">\u003cfigcaption>팀 활동 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p4-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>프로젝트 목표, 범위, 완료 기준과 제외 범위를 합의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 프로젝트 목표, 범위, 완료 기준과 제외 범위를 합의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>역할을 단순 직책이 아니라 책임, 산출물과 기한으로 정의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 역할을 단순 직책이 아니라 책임, 산출물과 기한으로 정의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역5-03-역할책임정의.png\" alt=\"역할을 책임으로 정의하기\">\u003cfigcaption>역할을 책임으로 정의하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>회의 전 안건과 회의 후 결정사항·담당자·기한을 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 회의 전 안건과 회의 후 결정사항·담당자·기한을 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI로 회의록 초안을 만들되 발언자를 임의로 추정하지 않게 한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI로 회의록 초안을 만들되 발언자를 임의로 추정하지 않게 한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>변경 이력과 미해결 쟁점을 기록한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 변경 이력과 미해결 쟁점을 기록한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역5-04-변경이력미해결쟁점.png\" alt=\"변경 이력과 미해결 쟁점\">\u003cfigcaption>변경 이력과 미해결 쟁점\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\"> "group":"campus","number":"06","title":"대학 행정과 공식적인 의사소통","fullTitle":"강의 영역 6 : 대학 행정과 공식적인 의사소통","summary":"수강생은 학사 공지와 규정을 정확히 읽고, 목적·상대방·근거·요청사항이 명확한 이메일과 문의문을 작성하며 회신 및 처리 결과를 기록할 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역6-01-대학행정공식소통.png\" alt=\"대학 행정과 공식적인 의사소통\">\u003cfigcaption>대학 행정과 공식적인 의사소통\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p5-1\">학습목표\u003c/h3>\u003cp>수강생은 학사 공지와 규정을 정확히 읽고, 목적·상대방·근거·요청사항이 명확한 이메일과 문의문을 작성하며 회신 및 처리 결과를 기록할 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역6-02-공식소통6단계.png\" alt=\"공식 소통 6단계\">\u003cfigcaption>공식 소통 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p5-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>공지에서 대상, 요건, 제출서류, 기한과 담당 부서를 추출한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI의 답보다 원자료가 판단의 기준이다. 출처와 작성 시점까지 함께 확보해야 나중에 다시 검증할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 공지에서 대상, 요건, 제출서류, 기한과 담당 부서를 추출한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 원문 위치, 작성자 또는 기관, 날짜가 노트에 남았는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>사실, 개인 상황과 요청사항을 구분한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 사실, 개인 상황과 요청사항을 구분한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역6-03-사실상황요청구분.png\" alt=\"사실, 상황과 요청 구분\">\u003cfigcaption>사실, 상황과 요청 구분\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>이메일 제목에 과목·업무·요청을 구체적으로 표시한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 이메일 제목에 과목·업무·요청을 구체적으로 표시한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>본문은 인사, 신원, 상황, 확인한 근거, 질문 또는 요청, 감사 순으로 구성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 본문은 인사, 신원, 상황, 확인한 근거, 질문 또는 요청, 감사 순으로 구성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>감정적 표현, 과도한 사과와 AI 특유의 장황함을 줄인다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 감정적 표현, 과도한 사과와 AI 특유의 장황함을 줄인다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역6-04-간결한공식문장.png\" alt=\"짧고 정중한 문장 다듬기\">\u003cfigcaption>짧고 정중한 문장 다듬기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>발송 전 수신자, 첨부파일, 개인정보와 날짜를 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 발송 전 수신자, 첨부파일, 개인정보와 날짜를 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>문의, 회신, 후속 조치와 완료 상태를 Markdown 로그로 남긴다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 문의, 회신, 후속 조치와 완료 상태를 Markdown 로그로 남긴다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역6-05-행정소통기록관리.png\" alt=\"행정 소통 기록 관리\">\u003cfigcaption>행정 소통 기록 관리\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p5-3\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>교수자·조교 문의 이메일\u003c/li>\n\u003cli>수강 정정, 휴·복학, 장학 또는 증명서 관련 문의문\u003c/li>\n\u003cli>면담 요청 및 일정 조율 메시지\u003c/li>\n\u003cli>행정 문의와 처리 결과 로그\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"p5-4\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 공식 의사소통 기록\n\n- 목적 :\n- 수신자 :\n- 확인한 공지·규정 :\n- 요청사항 :\n- 첨부파일 :\n- 발송일 :\n- 회신일 :\n- 후속 조치 :\n- 상태 : 작성중 | 발송 | 회신대기 | 완료\u003c/code>\u003c/pre>\u003c/div>"},{"id":"area-7","group":"campus","number":"07","title":"장학금, 공모전과 진로 포트폴리오","fullTitle":"강의 영역 7 : 장학금, 공모전과 진로 포트폴리오","summary":"수강생은 모집 공고의 요구사항을 증거 중심으로 분석하고, 자신의 경험을 과장하지 않으면서 지원서·제안서·포트폴리오를 목적에 맞게 재구성할 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역7-01-장학금공모전포트폴리오.png\" alt=\"장학금, 공모전과 진로 포트폴리오\">\u003cfigcaption>장학금, 공모전과 진로 포트폴리오\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p6-1\">학습목표\u003c/h3>\u003cp>수강생은 모집 공고의 요구사항을 증거 중심으로 분석하고, 자신의 경험을 과장하지 않으면서 지원서·제안서·포트폴리오를 목적에 맞게 재구성할 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역7-02-지원준비6단계.png\" alt=\"지원 준비 6단계\">\u003cfigcaption>지원 준비 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p6-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>공고에서 자격, 평가 기준, 제출물, 형식과 일정을 추출한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 공고에서 자격, 평가 기준, 제출물, 형식과 일정을 추출한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>경험을 상황, 과제, 행동, 결과와 증거로 분해한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 경험을 상황, 과제, 행동, 결과와 증거로 분해한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역7-03-경험근거분해.png\" alt=\"경험을 근거로 분해하기\">\u003cfigcaption>경험을 근거로 분해하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>요구 역량과 자신의 경험을 매칭한 근거표를 만든다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 요구 역량과 자신의 경험을 매칭한 근거표를 만든다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI에게 부족한 정보를 질문하게 하고 없는 성과를 만들지 못하게 한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI에게 부족한 정보를 질문하게 하고 없는 성과를 만들지 못하게 한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>하나의 경험 원본 노트를 장학금, 공모전과 진로 목적에 맞게 재구성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 하나의 경험 원본 노트를 장학금, 공모전과 진로 목적에 맞게 재구성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역7-04-경험목적별재구성.png\" alt=\"하나의 경험, 세 가지 지원서\">\u003cfigcaption>하나의 경험, 세 가지 지원서\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>수치, 수상, 역할과 기여도를 증빙자료로 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 수치, 수상, 역할과 기여도를 증빙자료로 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>제출 버전과 원본 경험 노트를 연결해 향후 수정 가능하게 한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 제출 버전과 원본 경험 노트를 연결해 향후 수정 가능하게 한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역7-05-지원이력포트폴리오관리.png\" alt=\"지원 이력과 포트폴리오 관리\">\u003cfigcaption>지원 이력과 포트폴리오 관리\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p6-3\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>공고 분석표와 마감 계획\u003c/li>\n\u003cli>역량–경험–증거 매칭표\u003c/li>\n\u003cli>장학금 자기소개 또는 공모전 제안 개요\u003c/li>\n\u003cli>프로젝트 포트폴리오 사례 페이지\u003c/li>\n\u003cli>면접 예상 질문과 근거 답변 노트\u003c/li>\n\u003c/ul>\n"},{"id":"area-8","group":"campus","number":"08","title":"외국어 학습, 공인영어와 정보 접근성","fullTitle":"강의 영역 8 : 외국어 학습, 공인영어와 정보 접근성","summary":"수강생은 전공 외국어 자료를 정확하게 읽고, 공인영어시험의 목표와 취약 영역에 맞는 학습 계획을 만들며 동일 내용을 접근 가능한 여러 형식으로 변환할 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역8-01-외국어공인영어학습.png\" alt=\"외국어 학습, 공인영어와 정보 접근성\">\u003cfigcaption>외국어 학습, 공인영어와 정보 접근성\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p7-1\">학습목표\u003c/h3>\u003cp>수강생은 전공 외국어 자료를 정확하게 읽고, 공인영어시험의 목표와 취약 영역에 맞는 학습 계획을 만들며 동일 내용을 접근 가능한 여러 형식으로 변환할 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역8-02-외국어학습6단계.png\" alt=\"외국어 학습 6단계\">\u003cfigcaption>외국어 학습 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p7-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>목표 시험, 목표 점수, 시험일과 주당 학습시간을 정한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 목표 시험, 목표 점수, 시험일과 주당 학습시간을 정한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>진단 결과를 독해, 듣기, 말하기와 쓰기 영역으로 분리한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 진단 결과를 독해, 듣기, 말하기와 쓰기 영역으로 분리한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역8-03-영역별진단.png\" alt=\"영역별 진단하기\">\u003cfigcaption>영역별 진단하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>전공 자료의 핵심 용어와 문장 구조를 분석해 이중언어 용어집을 만든다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 전공 자료의 핵심 용어와 문장 구조를 분석해 이중언어 용어집을 만든다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>독해는 근거 문장과 오답 선택지의 오류 유형을 분석한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 독해는 근거 문장과 오답 선택지의 오류 유형을 분석한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>듣기는 스크립트, 발음과 연결 발음을 이용해 반복 훈련한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처 , 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역8-05-접근가능한학습자료.png\" alt=\"접근 가능한 학습 자료\">\u003cfigcaption>접근 가능한 학습 자료\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역8-06-외국어학습기록관리.png\" alt=\"외국어 학습 기록 관리\">\u003cfigcaption>외국어 학습 기록 관리\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p7-3\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>이중언어 전공 용어집\u003c/li>\n\u003cli>공인영어 목표 및 주차별 학습 계획\u003c/li>\n\u003cli>오답 원인과 취약 영역 대시보드\u003c/li>\n\u003cli>독해·듣기·말하기·쓰기 개인 훈련 세트\u003c/li>\n\u003cli>자막과 대체 텍스트가 포함된 접근 가능한 발표자료\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"p7-4\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 외국어·공인영어 학습 기록\n\n## 목표와 일정\n\n## 진단 결과\n\n## 오늘의 원문\n\n## 핵심 표현과 전공 용어\n\n## 오류와 수정 이유\n\n## 다음 반복 일정\u003c/code>\u003c/pre>\u003c/div>"},{"id":"area-9","group":"campus","number":"09","title":"코딩 학습과 실전 대비","fullTitle":"강의 영역 9 : 코딩 학습과 실전 대비","summary":"수강생은 문제를 작은 단위로 분해하고, AI의 설명과 힌트를 이용해 코드를 직접 이해·실행·테스트하며 오류 수정 과정을 재현 가능한 개발 노트로 남길 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-01-코딩학습과실전대비.png\" alt=\"코딩 학습과 실전 대비\">\u003cfigcaption>코딩 학습과 실전 대비\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p8-1\">학습목표\u003c/h3>\u003cp>수강생은 문제를 작은 단위로 분해하고, AI의 설명과 힌트를 이용해 코드를 직접 이해·실행·테스트하며 오류 수정 과정을 재현 가능한 개발 노트로 남길 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-02-코딩학습6단계.png\" alt=\"코딩 학습 6단계\">\u003cfigcaption>코딩 학습 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p8-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>문제를 입력, 처리, 출력과 제약조건으로 나눈다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 문제를 입력, 처리, 출력과 제약조건으로 나눈다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>완성 코드를 요청하기 전에 의사코드를 작성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 완성 코드를 요청하기 전에 의사코드를 작성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-03-의사코드부터시작하기.png\" alt=\"의사코드부터 시작하기\">\u003cfigcaption>의사코드부터 시작하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>작은 함수와 테스트 단위로 구현한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 작은 함수와 테스트 단위로 구현한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI가 제안한 코드의 각 줄과 상태 변화를 설명한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI가 제안한 코드의 각 줄과 상태 변화를 설명한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>오류 메시지, 실행 환경과 재현 절차를 기록한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 오류 메시지, 실행 환경과 재현 절차를 기록한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-04-오류재현과기록.png\" alt=\"오류를 재현하고 기록하기\">\u003cfigcaption>오류를 재현하고 기록하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>정상값, 경계값, 오류 입력과 반례를 테스트한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 정상값, 경계값, 오류 입력과 반례를 테스트한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>같은 문제의 여러 풀이를 가독성, 시간·공간 복잡도와 확장성으로 비교한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 같은 문제의 여러 풀이를 가독성, 시간·공간 복잡도와 확장성으로 비교한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>라이브러리, 라이선스, 보안, 개인정보와 배포 조건을 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 라이브러리, 라이선스, 보안, 개인정보와 배포 조건을 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-05-라이브러리와배포조건.png\" alt=\"라이브러리와 배포 조건 확인\">\u003cfigcaption>라이브러리와 배포 조건 확인\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-06-코딩실습시작에서완료.png\" alt=\"코딩 실습 : 시작에서 완료까지\">\u003cfigcaption>코딩 실습 : 시작에서 완료까지\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p8-3\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cp>오류가 포함된 짧은 코드를 바로 고치지 않고 다음 순서로 진단한다.\u003c/p>\n\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-text\">오류 재현\n→ 오류 메시지 해석\n→ 최소 재현 예제\n→ 원인 가설\n→ 한 가지 수정\n→ 테스트\n→ 회귀 오류 확인\u003c/code>\u003c/pre>\u003c/div>\u003c/div>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역9-07-디버깅지식연결.png\" alt=\"디버깅 지식으로 연결하기\">\u003cfigcaption>디버깅 지식으로 연결하기\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p8-4\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>문제 분해표와 의사코드\u003c/li>\n\u003cli>개인 코딩 학습 로드맵\u003c/li>\n\u003cli>코드 추적 학습 노트\u003c/li>\n\u003cli>테스트가 포함된 미니 프로젝트\u003c/li>\n\u003cli>오류 원인과 수정 과정을 기록한 디버깅 노트\u003c/li>\n\u003cli>코드의 선택 이유와 개선 방향을 설명한 리뷰\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"p8-5\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 디버깅 기록\n\n## 기대한 동작\n\n## 실제 동작과 오류 메시지\n\n## 실행 환경\n\n## 최소 재현 예제\n\n## 원인 가설\n\n## 시도와 결과\n\n## 최종 수정\n\n## 테스트와 남은 한계\u003c/code>\u003c/pre>\u003c/div>"},{"id":"area-10","group":"research","number":"10","title":"페이퍼 리뷰와 메타분석 기반 학습","fullTitle":"강의 영역 10 : 페이퍼 리뷰와 메타분석 기반 학습","summary":"수강생은 연구 질문과 검색 절차를 정의하고 논문의 방법·결과·한계를 비교하며, 체계적 문헌고찰과 메타분석을 단순 요약과 구분해 재현 가능한 검토 기록을 만들 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-01-페이퍼리뷰와메타분석.png\" alt=\"페이퍼 리뷰와 메타분석\">\u003cfigcaption>페이퍼 리뷰와 메타분석\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p9-1\">학습목표\u003c/h3>\u003cp>수강생은 연구 질문과 검색 절차를 정의하고 논문의 방법·결과·한계를 비교하며, 체계적 문헌고찰과 메타분석을 단순 요약과 구분해 재현 가능한 검토 기록을 만들 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-02-논문검토6단계.png\" alt=\"논문 검토 6단계\">\u003cfigcaption>논문 검토 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p9-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>연구 질문을 대상, 개입·노출, 비교와 결과로 구체화한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 연구 질문을 대상, 개입·노출, 비교와 결과로 구체화한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>검색 데이터베이스, 검색어, 동의어, 기간과 언어를 정의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 검색 데이터베이스, 검색어, 동의어, 기간과 언어를 정의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-03-검색전략기록.png\" alt=\"검색 전략을 기록하기\">\u003cfigcaption>검색 전략을 기록하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>검색일, 검색식과 검색 건수를 기록한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 검색일, 검색식과 검색 건수를 기록한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>중복 제거 후 제목·초록과 전문 검토의 포함·배제 사유를 남긴다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 중복 제거 후 제목·초록과 전문 검토의 포함·배제 사유를 남긴다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>연구 설계, 표본, 측정, 주요 결과, 효과크기와 한계를 추출한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 연구 설계, 표본, 측정, 주요 결과, 효과크기와 한계를 추출한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-04-논문정보비교표.png\" alt=\"논문 정보를 비교표로 정리하기\">\u003cfigcaption>논문 정보를 비교표로 정리하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>논문 간 합의, 차이, 상충 결과와 연구 공백을 비교한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI의 답보다 원자료가 판단의 기준이다. 출처와 작성 시점까지 함께 확보해야 나중에 다시 검증할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 논문 간 합의, 차이, 상충 결과와 연구 공백을 비교한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 원문 위치, 작성자 또는 기관, 날짜가 노트에 남았는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>AI가 제시한 논문, DOI와 인용문이 실제로 존재하는지 검증한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> AI가 제시한 논문, DOI와 인용문이 실제로 존재하는지 검증한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>메타분석을 수행할 경우 효과크기 정의, 이질성과 편향을 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 메타분석을 수행할 경우 효과크기 정의, 이질성과 편향을 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-05-효과크기와편향.png\" alt=\"효과크기와 편향 확인\">\u003cfigcaption>효과크기와 편향 확인\u003c/figcaption>\u003c/figure>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역10-06-논문노트지식연결.png\" alt=\"논문 노트를 지식으로 연결하기\">\u003cfigcaption>논문 노트를 지식으로 연결하기\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p9-3\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>연구 질문과 검색식 초안\u003c/li>\n\u003cli>검색 및 문헌 선별 기록\u003c/li>\n\u003cli>논문 비교표와 근거 지도\u003c/li>\n\u003cli>페이퍼 리뷰 개요 또는 미니 문헌고찰\u003c/li>\n\u003cli>AI 추천 논문 및 인용 검증표\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"p9-4\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\">---\ntitle: &quot;논문 제목&quot;\nauthors: []\nyear:\ndoi:\nstudy_design:\nreview_status: 초록검토 | 전문검토 | 포함 | 제외\n---\n\n# 논문 노트\n\n## 연구 질문\n\n## 방법과 표본\n\n## 주요 결과\n\n## 효과크기와 불확실성\n\n## 한계와 편향 위험\n\n## 나의 평가\n\n## 관련 연구\u003c/code>\u003c/pre>\u003c/div>"},{"id":"area-11","group":"research","number":"11","title":"실험 수업, 불확실성과 통계 분석","fullTitle":"강의 영역 11 : 실험 수업, 불확실성과 통계 분석","summary":"수강생은 원자료를 보존하면서 데이터를 정제하고, 불확실성·회귀·ANOVA와 통계 그림을 목적과 가정에 맞게 수행한 뒤 코드, 설정, 결과와 해석을 재현 가능한 실험 노트로 남길 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-01-실험불확실성통계분석.png\" alt=\"실험·불확실성·통계 분석\">\u003cfigcaption>실험·불확실성·통계 분석\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p10-1\">학습목표\u003c/h3>\u003cp>수강생은 원자료를 보존하면서 데이터를 정제하고, 불확실성·회귀·ANOVA와 통계 그림을 목적과 가정에 맞게 수행한 뒤 코드, 설정, 결과와 해석을 재현 가능한 실험 노트로 남길 수 있다.\u003c/p>\n\u003ch3 id=\"p10-2\">준비하기\u003c/h3>\u003cul>\n\u003cli>개인정보가 제거된 실험 데이터\u003c/li>\n\u003cli>실험 지침과 측정 장비 사양\u003c/li>\n\u003cli>단위 및 유효숫자 오류가 포함된 예제\u003c/li>\n\u003cli>이상치 제거 전후가 다른 결과를 만드는 사례\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-02-데이터분석6단계.png\" alt=\"데이터 분석 6단계\">\u003cfigcaption>데이터 분석 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p10-3\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>실험 목적, 독립변수, 종속변수, 통제변수와 단위를 정의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 실험 목적, 독립변수, 종속변수, 통제변수와 단위를 정의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>원자료를 읽기 전용으로 보존하고 정제본을 별도 생성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 원자료를 읽기 전용으로 보존하고 정제본을 별도 생성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-03-원자료와정제본분리.png\" alt=\"원자료와 정제본 분리하기\">\u003cfigcaption>원자료와 정제본 분리하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">03\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>결측치와 이상치 처리 규칙 및 이유를 기록한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 결측치와 이상치 처리 규칙 및 이유를 기록한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">04\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>측정기 분해능, 반복 측정과 보정 등 불확실성 성분을 구분한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 측정기 분해능, 반복 측정과 보정 등 불확실성 성분을 구분한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">05\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>계산식, 단위, 유효숫자와 불확실성 전파를 검토한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 계산식, 단위, 유효숫자와 불확실성 전파를 검토한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-04-불확실성계산검토.png\" alt=\"불확실성 계산을 검토하기\">\u003cfigcaption>불확실성 계산을 검토하기\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">06\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>회귀모형의 목적과 가정을 정하고 잔차를 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 회귀모형의 목적과 가정을 정하고 잔차를 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">07\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>ANOVA의 가정, 검정 결과, 효과크기와 필요한 사후검정을 확인한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI 결과는 완성본이 아니라 검토 대상이다. 사실, 계산, 실행 결과와 학업윤리 기준을 직접 확인해야 한다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> ANOVA의 가정, 검정 결과, 효과크기와 필요한 사후검정을 확인한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 틀린 부분과 수정 이유를 Markdown 검증 기록에 남긴다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">08\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>구간 그림, 개별값 그림, 상자그림과 잔차 그림을 목적에 맞게 생성한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> AI에는 작업의 목적, 사용할 원자료, 지켜야 할 조건과 출력 형식을 함께 주어야 수정 가능한 초안을 받을 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 구간 그림, 개별값 그림, 상자그림과 잔차 그림을 목적에 맞게 생성한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> AI가 원자료에 없는 사실, 결정, 수치나 출처를 덧붙이지 않았는지 대조한다.\u003c/p>\u003c/div>\u003c/section>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-05-목적에맞는통계그림.png\" alt=\"목적에 맞는 통계 그림\">\u003cfigcaption>목적에 맞는 통계 그림\u003c/figcaption>\u003c/figure>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">09\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>통계적 유의성과 실제적 중요성을 구분해 해석한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 통계적 유의성과 실제적 중요성을 구분해 해석한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">10\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>데이터 버전, 코드, 패키지, 실행 환경과 출력 파일을 연결한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 결과만 저장하면 다음 과제에서 다시 처음부터 시작하게 된다. 과정과 판단 근거까지 남겨야 지식으로 재사용할 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 데이터 버전, 코드, 패키지, 실행 환경과 출력 파일을 연결한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 파일명, 출처, 프롬프트, 수정 이력과 관련 노트 링크가 포함됐는지 확인한다.\u003c/p>\u003c/div>\u003c/section>\u003c/div>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-06-실험분석시작에서재현.png\" alt=\"실험 분석 : 시작에서 재현까지\">\u003cfigcaption>실험 분석 : 시작에서 재현까지\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p10-4\">화면을 보며 따라 하기\u003c/h3>\u003cdiv class=\"practice-example\">\u003cdiv class=\"practice-label\">시연을 보며 확인할 점\u003c/div>\u003cp>동일한 데이터에서 이상치를 임의로 제거했을 때와 사전 규칙에 따라 처리했을 때의 결과를 비교한다. AI가 추천한 분석법을 그대로 실행하지 않고 실험 설계와 모형 가정에 맞는지 점검하는 과정을 보여준다.\u003c/p>\n\u003c/div>\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역11-07-재현가능한분석노트연결.png\" alt=\"재현 가능한 분석 노트 연결\">\u003cfigcaption>재현 가능한 분석 노트 연결\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p10-5\">완성할 결과물\u003c/h3>\u003cul>\n\u003cli>데이터 사전과 정제 기록\u003c/li>\n\u003cli>분석 코드 및 실행 환경 기록\u003c/li>\n\u003cli>불확실성 예산표와 계산 결과\u003c/li>\n\u003cli>회귀·ANOVA 결과표\u003c/li>\n\u003cli>구간·개별값·상자·잔차 그림\u003c/li>\n\u003cli>결과 해석과 한계를 포함한 실험 보고서 초안\u003c/li>\n\u003cli>실험 준비 및 안전 점검표\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"p10-6\">Markdown으로 기록하기\u003c/h3>\u003cdiv class=\"code-wrap\">\u003cbutton class=\"copy\" type=\"button\">복사\u003c/button>\u003cpre>\u003ccode class=\"language-markdown\"># 실험·통계 분석 기록\n\n## 실험 목적과 설계\n\n## 데이터 파일과 버전\n\n## 정제 규칙과 변경 이력\n\n## 분석 방법과 선택 근거\n\n## 가정 점검\n\n## 결과 표와 그림\n\n## 해석과 한계\n\n## 코드·환경·재현 절차\u003c/code>\u003c/pre>\u003c/div>"},{"id":"area-12","group":"planning","number":"12","title":"제품·서비스 기획과 품질 분석","fullTitle":"강의 영역 12 : 제품·서비스 기획과 품질 분석","summary":"수강생은 고객의 원문 발언에서 요구를 추출하고, 문제에 맞는 분석 도구를 선택해 우선순위와 대안을 비교하며 근거와 미검증 가설을 구분한 제품·서비스 기획 기록을 만들 수 있다.","html":"\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역12-01-제품서비스기획과품질분석.png\" alt=\"제품·서비스 기획과 품질 분석\">\u003cfigcaption>제품·서비스 기획과 품질 분석\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p11-1\">학습목표\u003c/h3>\u003cp>수강생은 고객의 원문 발언에서 요구를 추출하고, 문제에 맞는 분석 도구를 선택해 우선순위와 대안을 비교하며 근거와 미검증 가설을 구분한 제품·서비스 기획 기록을 만들 수 있다.\u003c/p>\n\u003cfigure class=\"lesson-visual\">\u003cimg src=\"images_demo/강의영역12-02-제품기획6단계.png\" alt=\"제품 기획 6단계\">\u003cfigcaption>제품 기획 6단계\u003c/figcaption>\u003c/figure>\u003ch3 id=\"p11-2\">따라 해보기\u003c/h3>\u003cdiv class=\"step-list\">\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">01\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>해결할 문제, 고객, 의사결정과 필요한 근거를 정의한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 해결할 문제, 고객, 의사결정과 필요한 근거를 정의한다. 작업을 수행하고, 작업 전후의 차이를 Markdown 노트에 한두 문장으로 기록한다.\u003c/p>\u003cp>\u003cstrong>확인하기\u003c/strong> 완료 후에는 처음 정한 목적과 결과가 일치하는지 자신의 말로 설명해 본다.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"step-card\">\u003cdiv class=\"step-number\">02\u003c/div>\u003cdiv class=\"step-content\">\u003ch4>인터뷰·설문·후기에서 VOC를 원문과 함께 추출한다.\u003c/h4>\u003cp>\u003cstrong>왜 필요한가\u003c/strong> 이 단계의 기준을 먼저 분명히 해 두면 AI가 그럴듯하지만 목적에서 벗어난 결과를 만드는 일을 줄일 수 있다.\u003c/p>\u003cp>\u003cstrong>따라 하기\u003c/strong> 인터뷰·설문·후기에서 VOC를 원문과 함께 추출한다. 작업을 수행하고, 작업
